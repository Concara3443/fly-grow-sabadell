<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Enviar correo - Fly & Grow</title>
<style>
:root{--blue:#223D58;--bg:#0d151f;--panel:#152233;--text:#E7E9ED;--muted:#7C90A6;--line:rgba(111,163,216,0.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,'IBM Plex Mono',monospace;padding:32px 16px;display:flex;justify-content:center}
.card{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px}
h1{font-size:18px;margin:0 0 20px}
.field{margin-bottom:16px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--text);padding:10px;font-family:inherit;font-size:14px}
textarea{min-height:140px;resize:vertical}
button{width:100%;background:var(--blue);color:#fff;border:none;border-radius:4px;padding:12px;font-size:14px;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;font-size:13px;text-align:center}
.msg.ok{color:#4caf7d}
.msg.err{color:#e0473e}
</style>
</head>
<body>
<div class="card">
  <h1>Enviar correo desde flyandgrow.es</h1>
  <p style="margin:-10px 0 20px;font-size:13px"><a href="inscritos.html" style="color:#86BEF5">Ver inscritos y empresas</a></p>
  <form id="f">
    <div class="field">
      <label for="to">Para</label>
      <input type="email" id="to" required>
    </div>
    <div class="field">
      <label for="subject">Asunto</label>
      <input type="text" id="subject" required maxlength="200">
    </div>
    <div class="field">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" required maxlength="5000"></textarea>
    </div>
    <button type="submit" id="btn">Enviar</button>
  </form>
  <p class="msg" id="msg" hidden></p>
</div>
<script>
const f = document.getElementById('f');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  msg.hidden = true;
  const payload = {
    to: document.getElementById('to').value,
    subject: document.getElementById('subject').value,
    mensaje: document.getElementById('mensaje').value,
  };
  try {
    const res = await fetch('/admin/enviar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error();
    msg.textContent = 'Enviado.';
    msg.className = 'msg ok';
    msg.hidden = false;
    f.reset();
  } catch {
    msg.textContent = 'No se ha podido enviar.';
    msg.className = 'msg err';
    msg.hidden = false;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
